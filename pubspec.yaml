name: cord
description: A Flutter web app scaffold — a frontpage that links to several pages.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Web URL strategy (usePathUrlStrategy) — ships with the Flutter SDK.
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Libyco-Berber letterform images for the Tifinagh page (letters with no
    # Unicode codepoint). CC0 — see assets/tifi/libyco_berber/SOURCE.txt.
    - assets/tifi/libyco_berber/
    # The Makasar and Lontara letterforms as drawn, shown at the head of every
    # row of the Lontara page's reference (see GlyphImage) — the only rendering
    # there is of the Lontara ones, no bundled font covering the Buginese block.
    - assets/makasar/glyphs/
  fonts:
    # Runic glyphs for the Futhark page's reference tables (Flutter web does
    # not fall back to a system font for the Runic block). SIL OFL — see
    # assets/furthak/OFL.txt.
    - family: NotoSansRunic
      fonts:
        - asset: assets/furthak/NotoSansRunic-Regular.ttf
    # Tifinagh glyphs for the Tifinagh page (recognized-letter readout +
    # reference tables). SIL OFL — see assets/tifi/OFL.txt.
    - family: NotoSansTifinagh
      fonts:
        - asset: assets/tifi/NotoSansTifinagh-Regular.ttf
    # Makasar glyphs for the Lontara page (recognized-character readout +
    # reference table). SIL OFL — see assets/makasar/OFL.txt.
    - family: NotoSerifMakasar
      fonts:
        - asset: assets/makasar/NotoSerifMakasar-Regular.ttf
    # Sinhala glyphs for the Sinhala numerals page (recognized-numeral readout
    # + reference tables): the Lith digits at U+0DE6–U+0DEF and the Illakkam
    # symbols at U+111E1–U+111F4, which sit outside the Basic Multilingual
    # Plane. Flutter web has no guaranteed system Sinhala font, and Yaldevi's
    # Lith forms match the traditional shapes where Noto Sans's do not. SIL
    # OFL — see assets/sinhala/OFL.txt and FONT_NOTE.txt.
    - family: Yaldevi
      fonts:
        - asset: assets/sinhala/Yaldevi-Regular.ttf
