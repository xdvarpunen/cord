name: Deploy to GitHub Pages

# Builds the Flutter web app and publishes it to GitHub Pages on every push to
# the default branch (or on demand). Enable it once in the repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The app is served from a project page (username.github.io/<repo>/), so the
# build sets --base-href to "/<repo>/". If you instead deploy to a user/org
# page (a "<user>.github.io" repo) or a custom domain at the root, change
# BASE_HREF below to "/".

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least-privilege token plus the OIDC/pages scopes the deploy step needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let a newer push supersede an in-flight
# one (but let a running deploy finish rather than cancelling it).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: >-
          flutter build web --release --no-tree-shake-icons
          --base-href "/${{ github.event.repository.name }}/"

      - name: Add SPA fallback (path-URL deep links)
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
